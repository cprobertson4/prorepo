<!DOCTYPE html>
<html>
<head>
    <title>Lab 3 - Chicago Burger Density Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="text/javascript" src="data.js"></script>
    <style>
        /* Adjust the values below to change the appearance of the legend */
        .legend { 
            padding: 6px 8px; 
            line-height: 18px; 
            background: rgba(255,255,255,0.9); 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            border-radius: 4px; 
            font-family: Arial, sans-serif;
        }
        /* Adjust the values below to change the appearance of the legend color boxes */
        .legend i { 
            width: 18px; 
            height: 18px; 
            float: left; 
            margin-right: 8px; 
            opacity: 0.7; 
        }
    </style>
</head>
<body>
    <div id="map" style="height: 600px; width: 100%;"></div>

    <script type="text/javascript">
        
        var map = L.map('map', { center: [41.83, -87.62], zoom: 12 });

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { 
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ', 
            maxZoom: 16, 
            minZoom: 5 
        }).addTo(map);

        
        function getColor(value) {
            return value > 8257 ? '#993404': 
                   value > 5368 ? '#d95f0e': 
                   value > 3852 ? '#fe9929': 
                   value > 1847 ? '#fed98e': 
                                  '#ffffd4';
        }

        function style(feature){
            return {
                fillColor: getColor(feature.properties.PopDen), 
                weight: 2,
                opacity: 1,
                color: 'white',
                dashArray: '3',
                fillOpacity: 0.7
            };
        }

        
        var geojson; 

        function highlightFeature(e) {
            var feature = e.target;
            feature.setStyle({
                weight: 5,
                color: '#666',
                fillOpacity: 0.9
            });

            if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                feature.bringToFront();
            }
        }

        function resetHighlight(e) {
            geojson.resetStyle(e.target);
        }

        function onEachFeature(feature, layer) {
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight
            });
        }

        
        geojson = L.geoJson(data, {
            style: style,
            onEachFeature: onEachFeature
        }).bindPopup(function (layer){
            var props = layer.feature.properties;
            
            return '<b>Community:</b> ' + (props.community || 'Unknown') + 
                   '<p style="color:purple; margin:4px 0 0 0;">' + Math.round(props.PopDen) + ' people/hectare</p>';
        }).addTo(map);

        
        var legend = L.control({position: 'topright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend'),
                
                grades =[0, 1847, 3852, 5368, 8257]; 

            div.innerHTML = '<b>Population Density <br> 2011 <br></b>';

            for (var i = 0; i < grades.length; i++) {
                div.innerHTML += '<i style="background:' + getColor(grades[i] + 1) + '"></i>' + 
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
            }
            return div;
        };

        legend.addTo(map);
    </script>
</body>
</html>
